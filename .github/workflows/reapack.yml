name: ReaPack

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  reapack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Configura il nome del Robottino
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate ReaPack packages
        run: reapack-index --check

      - name: Update index.xml
        run: reapack-index --commit

      - name: Commit updated index.xml
        run: |
          git add index.xml
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Update ReaPack index [skip ci]"
          git push
